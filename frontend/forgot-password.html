<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StitchStock · Forgot password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login">
  <div class="login-decor login-decor-left" aria-hidden="true">♡　♡</div>
  <div class="login-decor login-decor-right" aria-hidden="true"><span class="flower flower-coral">✿</span><span class="flower flower-berry">✿</span></div>
  <main class="login-card">
    <div class="card-flower card-flower-bottom" aria-hidden="true">✿</div>
    <a class="back-link" id="backToLogin">← Back to login</a>
    <div class="brand compact">
      <div class="yarn-logo" aria-hidden="true"><img src="assets/yarn-logo.png" alt=""></div>
      <h1><span>Stitch</span><strong>Stock</strong></h1>
      <small>Handmade with Love <span aria-hidden="true">♥</span></small>
    </div>
    <h2 id="pageHeading">Forgot password?</h2>
    <p class="subtitle">Enter the email address for your account and we’ll send a secure reset link if it matches this account type.</p>
    <form id="resetRequestForm" novalidate>
      <div class="field">
        <label for="resetEmail">Registered email address</label>
        <div class="input-wrap">
          <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></span>
          <input id="resetEmail" type="email" autocomplete="email" placeholder="Email address" required>
        </div>
      </div>
      <p class="error" id="resetFeedback" role="status" aria-live="polite"></p>
      <button class="primary" id="sendResetLink" type="submit">Send reset link <span aria-hidden="true">→</span></button>
    </form>
  </main>
  <script src="js/api.js"></script>
  <script>
    const role = new URLSearchParams(location.search).get('role') === 'owner' ? 'owner' : 'customer';
    const $ = id => document.getElementById(id);
    $('pageHeading').textContent = role === 'owner' ? 'Admin password reset' : 'Forgot password?';
    $('backToLogin').href = `login.html?role=${encodeURIComponent(role)}`;
    $('resetRequestForm').onsubmit = async event => {
      event.preventDefault();
      const email = $('resetEmail').value.trim();
      const feedback = $('resetFeedback');
      const button = $('sendResetLink');
      feedback.classList.remove('success');
      feedback.textContent = '';
      if (!/^\S+@\S+\.\S+$/.test(email)) {
        feedback.textContent = 'Enter a valid email address.';
        return;
      }
      button.disabled = true;
      try {
        const result = await api('/auth/password-reset/request', 'POST', { email, role });
        feedback.textContent = result.message;
        feedback.classList.add('success');
      } catch (error) {
        feedback.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
