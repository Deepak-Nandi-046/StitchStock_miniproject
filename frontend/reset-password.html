<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StitchStock · Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login">
  <div class="login-decor login-decor-left" aria-hidden="true">♡　♡</div>
  <div class="login-decor login-decor-right" aria-hidden="true"><span class="flower flower-coral">✿</span><span class="flower flower-berry">✿</span></div>
  <main class="login-card">
    <div class="card-flower card-flower-bottom" aria-hidden="true">✿</div>
    <a class="back-link" id="backToLogin">← Back to login</a>
    <div class="brand compact">
      <div class="yarn-logo" aria-hidden="true"><img src="assets/yarn-logo.png" alt=""></div>
      <h1><span>Stitch</span><strong>Stock</strong></h1>
      <small>Handmade with Love <span aria-hidden="true">♥</span></small>
    </div>
    <h2 id="pageHeading">Create a new password</h2>
    <p class="subtitle">Choose a strong password you haven’t used before.</p>
    <form id="resetPasswordForm" novalidate>
      <div class="field">
        <label for="newPassword">New password</label>
        <div class="input-wrap">
          <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></span>
          <input id="newPassword" type="password" autocomplete="new-password" maxlength="64" placeholder="New password" required>
          <button type="button" class="icon-button" data-password-toggle="newPassword" aria-label="Show new password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.9A10.7 10.7 0 0 1 12 7c6 0 9.5 5 9.5 5a17 17 0 0 1-3.2 3.3M6.7 6.8C4 8.3 2.5 12 2.5 12s3.5 5 9.5 5c1.2 0 2.3-.2 3.2-.6"></path></svg>
          </button>
        </div>
      </div>
      <ul class="password-rules"><li>8–64 characters</li><li>Uppercase and lowercase letter</li><li>Number and special character</li></ul>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <div class="input-wrap">
          <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></span>
          <input id="confirmPassword" type="password" autocomplete="new-password" maxlength="64" placeholder="Confirm new password" required>
          <button type="button" class="icon-button" data-password-toggle="confirmPassword" aria-label="Show confirmation password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.9A10.7 10.7 0 0 1 12 7c6 0 9.5 5 9.5 5a17 17 0 0 1-3.2 3.3M6.7 6.8C4 8.3 2.5 12 2.5 12s3.5 5 9.5 5c1.2 0 2.3-.2 3.2-.6"></path></svg>
          </button>
        </div>
      </div>
      <p class="error" id="resetFeedback" role="status" aria-live="polite"></p>
      <button class="primary" id="savePassword" type="submit">Reset password <span aria-hidden="true">→</span></button>
    </form>
  </main>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get('token');
    const role = params.get('role') === 'owner' ? 'owner' : 'customer';
    const $ = id => document.getElementById(id);
    $('backToLogin').href = `login.html?role=${encodeURIComponent(role)}`;
    document.querySelectorAll('[data-password-toggle]').forEach(button => {
      button.onclick = () => {
        const input = $(button.dataset.passwordToggle);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        button.setAttribute('aria-label', `${show ? 'Hide' : 'Show'} ${button.dataset.passwordToggle === 'newPassword' ? 'new password' : 'confirmation password'}`);
        button.setAttribute('aria-pressed', String(show));
        button.classList.toggle('is-visible', show);
      };
    });
    if (!token) {
      $('resetFeedback').textContent = 'This reset link is invalid or has expired. Request a new link.';
      $('savePassword').disabled = true;
    }
    $('resetPasswordForm').onsubmit = async event => {
      event.preventDefault();
      const password = $('newPassword').value;
      const confirmPassword = $('confirmPassword').value;
      const feedback = $('resetFeedback');
      feedback.classList.remove('success');
      feedback.textContent = '';
      if (password.length < 8 || password.length > 64 ||
          !/[A-Z]/.test(password) || !/[a-z]/.test(password) ||
          !/\d/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
        feedback.textContent = 'Password must be 8-64 characters and include uppercase, lowercase, a number, and a special character.';
        return;
      }
      if (password !== confirmPassword) {
        feedback.textContent = 'Passwords do not match.';
        return;
      }
      const button = $('savePassword');
      button.disabled = true;
      try {
        const result = await api('/auth/password-reset/complete', 'POST', {
          token, role, password, confirmPassword
        });
        feedback.textContent = result.message;
        feedback.classList.add('success');
        $('pageHeading').textContent = 'Password updated';
        $('resetPasswordForm').reset();
        setTimeout(() => {
          location.href = `login.html?role=${encodeURIComponent(role)}&reset=success`;
        }, 1600);
      } catch (error) {
        feedback.textContent = error.message;
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
